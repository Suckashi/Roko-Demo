<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roko Chat</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #fff; --text: #1f2328; --muted: #6b7280;
      --accent: #4f46e5; --user: #4f46e5; --user-text: #fff; --bot: #eef0f4;
      --tool: #fff8e6; --tool-border: #f2d38a; --border: #e3e5ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318; --panel: #181b22; --text: #e6e8eb; --muted: #9aa0aa;
        --accent: #818cf8; --user: #4f46e5; --user-text: #fff; --bot: #232733;
        --tool: #2a2416; --tool-border: #6b5520; --border: #2b2f3a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.6 system-ui, -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
    .app { max-width: 820px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 18px; margin: 0; }
    header small { color: var(--muted); }
    button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    #log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
    .bot { align-self: flex-start; background: var(--bot); }
    .bot:empty::after { content: "思考中…"; color: var(--muted); }
    .event { align-self: flex-start; max-width: 85%; font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--tool); border: 1px solid var(--tool-border); border-radius: 10px; padding: 6px 10px; white-space: pre-wrap; word-break: break-word; }
    .todos { list-style: none; margin: 4px 0 0; padding: 0; }
    .error { align-self: center; color: #dc2626; }
    form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--border); }
    textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    form button { background: var(--accent); color: #fff; border: none; padding: 0 18px; }
    form button:disabled { opacity: .5; }
    label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><h1>🤖 Roko</h1><small>Deep Agents × OpenAI 相容 API</small></div>
      <div style="display:flex;gap:12px;align-items:center">
        <label><input type="checkbox" id="showSteps" checked /> 顯示 Agent 步驟</label>
        <button id="reset">新對話</button>
      </div>
    </header>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" rows="2" placeholder="輸入訊息，Enter 送出，Shift+Enter 換行"></textarea>
      <button id="send">送出</button>
    </form>
  </div>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const showSteps = document.getElementById("showSteps");
    let threadId = crypto.randomUUID();

    const add = (cls, text = "") => {
      const el = document.createElement("div");
      el.className = cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    };
    const step = (text) => { if (showSteps.checked) add("event", text); };
    const todoIcon = { pending: "⬜", in_progress: "⏳", completed: "✅" };

    document.getElementById("reset").onclick = () => { threadId = crypto.randomUUID(); log.innerHTML = ""; };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
    });

    form.onsubmit = async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      sendBtn.disabled = true;
      add("msg user", message);
      let bot = null; // 目前正在串流的回覆泡泡

      const handlers = {
        token: (t) => { bot ??= add("msg bot"); bot.textContent += t; log.scrollTop = log.scrollHeight; },
        tool: ({ name, args }) => { bot = null; step(`🔧 呼叫工具 ${name}\n${JSON.stringify(args, null, 2)}`); },
        result: ({ name, content }) => step(`📦 ${name} 回傳：\n${content}`),
        todos: (todos) => step("📝 待辦清單\n" + todos.map((t) => `${todoIcon[t.status] ?? "•"} ${t.content}`).join("\n")),
        error: ({ message }) => add("error", "⚠️ " + message),
      };

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ threadId, message }),
        });
        const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const events = buffer.split("\n\n");
          buffer = events.pop();
          for (const raw of events) {
            const event = raw.match(/^event: (.*)$/m)?.[1];
            const data = raw.match(/^data: (.*)$/m)?.[1];
            if (event && data) handlers[event]?.(JSON.parse(data));
          }
        }
      } catch (err) {
        add("error", "⚠️ " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    };
  </script>
</body>
</html>
