  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // 逐格圖：依時間算出第幾格（只看時間，不看上一格）
      function playSheet(el, frames, fps, w, start, dur) {
        const p = { t: 0 };
        tl.fromTo(
          p,
          { t: 0 },
          {
            t: dur,
            duration: dur,
            ease: "none",
            onUpdate: () => {
              const f = Math.floor(p.t * fps + 1e-6) % frames;
              el.style.backgroundPosition = `${-f * w}px 0px`;
            },
          },
          start,
        );
      }

      // 打字機：一個字一格
      function type(line, start) {
        const n = [...line.textContent].length;
        const d = n * 0.04;
        tl.fromTo(
          line,
          { clipPath: "inset(0 100% 0 0)" },
          { clipPath: "inset(0 0% 0 0)", duration: d, ease: `steps(${n})` },
          start,
        );
        return start + d;
      }
      [
        ["#route-t1", 0],
        ["#route-t2", 2.7],
        ["#route-t3", 5.6],
        ["#route-t4", 8.1],
      ].forEach(([sel, start]) => {
        const [l1, l2] = document.querySelector(sel).querySelectorAll(".route-line");
        type(l2, type(l1, start) + 0.05);
      });

      // 寶可夢的待機動作（黑／白版每格 0.1 秒）
      playSheet($("#route-hypno"), 64, 10, 67, 0, 12);
      playSheet($("#route-snorlax"), 90, 10, 74, 0, 12);
      playSheet($("#route-ditto"), 42, 10, 47, 0, 12);

      // Clawd 走進 Step 1，停在告示牌和引夢貘人之間
      tl.fromTo("#route-clawd", { x: 0 }, { x: 126, duration: 1.2, ease: "none", snap: "x" }, 0);
      playSheet($("#route-clawd"), 2, 1 / 0.15, 26, 0, 1.2);

      // 卡比獸頭上的 Z：一個接一個往上飄
      ["#route-z1", "#route-z2", "#route-z3"].forEach((sel, i) => {
        const start = i * 0.4;
        const repeat = Math.max(0, Math.floor((12 - start) / 1.2) - 1);
        tl.fromTo(sel, { y: 0 }, { y: -8, duration: 1.2, ease: "none", snap: "y", repeat }, start);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "none", yoyo: true, repeat: repeat * 2 + 1 }, start);
      });

      // 鏡頭：一站一站往右，最後快速拉回 Step 1
      // 同一個屬性有多段 fromTo，只有第一段立即套用起始值，否則最後一段會蓋掉第 0 秒的位置
      const pan = (from, to, at, dur, ease, first = false) =>
        tl.fromTo("#route-world", { x: from }, { x: to, duration: dur, ease, snap: "x", immediateRender: first }, at);
      pan(0, -240, 2.5, 0.5, "power2.inOut", true);
      pan(-240, -480, 5.4, 0.5, "power2.inOut");
      pan(-480, -720, 7.9, 0.5, "power2.inOut");
      pan(-720, 0, 10.4, 0.45, "power3.inOut");

      // 「！」跳出來
      tl.fromTo("#route-alert .route-bubble", { scale: 0 }, { scale: 1, duration: 0.12, ease: "back.out(2)" }, 10.85);

      // 白閃兩次
      tl.set("#route-flash", { opacity: 1 }, 11.3);
      tl.set("#route-flash", { opacity: 0 }, 11.38);
      tl.set("#route-flash", { opacity: 1 }, 11.46);
      tl.set("#route-flash", { opacity: 0 }, 11.54);

      // 黑條左右交錯合上
      document.querySelectorAll("#route-bars div").forEach((bar, i) => {
        tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power2.in" }, 11.62 + i * 0.02);
      });

      window.__timelines["route"] = tl;
    })();
  </script>
