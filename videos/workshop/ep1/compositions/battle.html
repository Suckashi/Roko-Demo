  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // 逐格圖：依時間算出第幾格（只看時間，不看上一格）
      function playSheet(el, frames, fps, w, start, dur) {
        const p = { t: 0 };
        tl.fromTo(
          p,
          { t: 0 },
          {
            t: dur,
            duration: dur,
            ease: "none",
            onUpdate: () => {
              const f = Math.floor(p.t * fps + 1e-6) % frames;
              el.style.backgroundPosition = `${-f * w}px 0px`;
            },
          },
          start,
        );
      }

      // 打字機：一個字一格
      function type(line, start) {
        const n = [...line.textContent].length;
        tl.fromTo(
          line,
          { clipPath: "inset(0 100% 0 0)" },
          { clipPath: "inset(0 0% 0 0)", duration: n * 0.04, ease: `steps(${n})` },
          start,
        );
      }

      // 黑條打開
      document.querySelectorAll("#battle-bars div").forEach((bar, i) => {
        tl.fromTo(bar, { scaleX: 1 }, { scaleX: 0, duration: 0.18, ease: "power2.out" }, i * 0.02);
      });

      // 雙方台座等速滑入（寶可夢原作的滑法）
      tl.fromTo("#battle-foe", { x: -220 }, { x: 0, duration: 0.6, ease: "none", snap: "x" }, 0.1);
      tl.fromTo("#battle-player", { x: 220 }, { x: 0, duration: 0.6, ease: "none", snap: "x" }, 0.1);
      playSheet($("#battle-hypno"), 64, 10, 67, 0, 9.6);

      // 野生的引夢貘人出現了！
      type($("#battle-m1 .battle-line"), 0.6);
      tl.fromTo("#battle-foehp", { x: -170 }, { x: 0, duration: 0.3, ease: "power2.out", snap: "x" }, 0.75);

      // 去吧！Clawd！精靈球拋物線、開球、Clawd 跳出來
      type($("#battle-m2 .battle-line"), 2.9);
      const ball = $("#battle-ball img");
      tl.fromTo(ball, { x: -12 }, { x: 76, duration: 0.5, ease: "none", snap: "x" }, 3.0);
      tl.fromTo(ball, { y: 118 }, { y: 66, duration: 0.25, ease: "power2.out", snap: "y" }, 3.0);
      tl.fromTo(ball, { y: 66 }, { y: 98, duration: 0.25, ease: "power2.in", snap: "y", immediateRender: false }, 3.25);
      tl.fromTo(ball, { rotation: 0 }, { rotation: 720, duration: 0.5, ease: "steps(16)" }, 3.0);
      tl.fromTo("#battle-burst .battle-flash", { scale: 0, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.28, ease: "power2.out" }, 3.5);
      tl.fromTo("#battle-clawd", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 3.55);
      playSheet($("#battle-clawd"), 2, 2.5, 70, 3.85, 5.75);
      tl.fromTo("#battle-php", { x: 160 }, { x: 0, duration: 0.3, ease: "power2.out", snap: "x" }, 3.8);

      // Clawd 要怎麼做？→ 招式選單，游標依序跳過四招
      type($("#battle-m3 .battle-line"), 4.2);
      [
        [0, 0, 5.6],
        [94, 0, 6.0],
        [0, 18, 6.4],
        [94, 18, 6.8],
        [0, 0, 7.2],
      ].forEach(([x, y, at]) => tl.set("#battle-cursor", { x, y }, at));

      // 下回分曉：從上方落下後停住
      tl.fromTo("#battle-banner .battle-sign", { y: -110 }, { y: 0, duration: 0.4, ease: "back.out(1.4)", snap: "y" }, 7.3);

      window.__timelines["battle"] = tl;
    })();
  </script>
