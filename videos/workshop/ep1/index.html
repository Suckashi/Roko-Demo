<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP 放在本機：這個環境連不到 CDN，渲染也不依賴網路 -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21.6"
      data-width="1920"
      data-height="1080"
    >
      <!-- 前段：路線地圖，四個 Step 的對手依序登場，最後遇到引夢貘人 -->
      <div
        id="route"
        data-composition-id="route"
        data-composition-src="compositions/route.html"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <!-- 後段：對戰開場，派出 Clawd，停在招式選單 -->
      <div
        id="battle"
        data-composition-id="battle"
        data-composition-src="compositions/battle.html"
        data-start="12"
        data-duration="9.6"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
